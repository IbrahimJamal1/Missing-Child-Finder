name: Build iOS Simulator

on:
  push:
    branches: [ main, master ] # أو اسم البرانش الذي تعمل عليه
  workflow_dispatch: # يتيح لك تشغيله يدوياً بضغطة زر

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (for Flutter toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator
        run: flutter build ios --simulator --no-codesign

      - name: Zip Runner.app
        run: |
          cd build/ios/iphonesimulator
          zip -r -y Runner.zip Runner.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: build/ios/iphonesimulator/Runner.zip